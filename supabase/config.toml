# Configuração do Supabase Auth do EstoqueOn (usada por `supabase config push`).
# Os mesmos valores estão descritos no README para quem configura pelo painel.
project_id = "estoqueon"

[auth]
site_url = "https://samuel-luciano-gomes.github.io/estoqueon/"
additional_redirect_urls = [
  "https://samuel-luciano-gomes.github.io/estoqueon/app.html",
  "https://samuel-luciano-gomes.github.io/estoqueon/nova-senha.html",
  "http://localhost:4330/app.html",
  "http://localhost:4330/nova-senha.html"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirme seu e-mail no EstoqueOn"
content_path = "./supabase/templates/confirmar-cadastro.html"

[auth.email.template.recovery]
subject = "Redefina sua senha do EstoqueOn"
content_path = "./supabase/templates/recuperar-senha.html"

[auth.email.template.magic_link]
subject = "Seu link de acesso ao EstoqueOn"
content_path = "./supabase/templates/link-magico.html"

[auth.email.template.email_change]
subject = "Confirme a troca de e-mail no EstoqueOn"
content_path = "./supabase/templates/trocar-email.html"

[auth.email.template.invite]
subject = "Você foi convidada para o EstoqueOn"
content_path = "./supabase/templates/convite.html"

[auth.email.template.reauthentication]
subject = "Código de confirmação do EstoqueOn"
content_path = "./supabase/templates/reautenticacao.html"

# Quando houver domínio próprio, ative o envio pelo seu serviço de e-mail (Resend, Brevo…):
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(SMTP_SENHA)"
# admin_email = "nao-responda@seudominio.com.br"
# sender_name = "EstoqueOn"
