<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Instalar o app · EstoqueOn</title>
<meta name="description" content="Instale o app do EstoqueOn no seu celular: estoque, vendas pelo QR, caixa e clientes da sua loja.">
<meta property="og:title" content="Instale o app do EstoqueOn">
<meta property="og:description" content="Vendas pelo QR da etiqueta, estoque, caixa e clientes da loja no seu celular.">
<meta property="og:image" content="https://samuel-luciano-gomes.github.io/estoqueon/assets/icones/icone-512.png">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#201819" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/icone.svg" type="image/svg+xml">
<link rel="icon" href="assets/icones/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/base.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Página única, no estilo das telas de conta: ícone do app, título e o caminho certo para cada aparelho. */
body{background:var(--surface)}
.inst{min-height:100vh;min-height:100svh;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.inst-topo{display:grid;justify-items:center;gap:12px;text-align:center}
.inst-topo img{width:96px;height:96px;border-radius:24px;box-shadow:0 16px 34px -16px rgba(90,35,45,.6),0 0 0 1px var(--line)}
.inst-topo h1{font-size:1.75rem;font-weight:600}
.inst-topo p{color:var(--muted);max-width:34ch}
.inst .btn{min-height:54px;border-radius:14px;font-family:var(--f-body);font-size:1.05rem;font-weight:600;letter-spacing:0;text-transform:none;width:100%}
.passos{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:p}
.passos li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);counter-increment:p}
.passos li::before{content:counter(p);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:600}
.passos b{font-weight:600}
.passos .ic{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--surface-2);vertical-align:middle;margin:0 2px;color:#0A84FF}
.passos .ic svg{width:18px;height:18px}
.recursos{display:grid;gap:8px;color:var(--muted);font-size:.92rem;list-style:none;margin:0;padding:0}
.recursos li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px}
.recursos li::before{content:"";width:7px;height:7px;margin-top:8px;border:1px solid var(--gold);transform:rotate(45deg)}
.qrbox{display:grid;justify-items:center;gap:10px;padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff;color:#1A1517;text-align:center}
.qrbox #qr img,.qrbox #qr canvas{width:180px!important;height:180px!important}
.seta{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;justify-items:center;gap:2px;color:var(--accent);font-size:.82rem;font-weight:600;animation:pula 1.4s ease-in-out infinite;pointer-events:none}
.seta svg{width:28px;height:28px}
@keyframes pula{50%{transform:translate(-50%,6px)}}
.rodape{margin-top:auto;text-align:center;font-size:.88rem;color:var(--muted);display:grid;gap:8px;justify-items:center}
.rodape a{color:var(--accent);font-weight:500;text-decoration:none}
</style>
</head>
<body>
<main class="inst">
  <div class="inst-topo">
    <img src="assets/icones/icone-192.png" alt="" width="96" height="96">
    <h1>EstoqueOn</h1>
    <p>Vendas pelo QR da etiqueta, estoque, caixa e clientes da loja no seu celular.</p>
  </div>
  <div id="conteudo"></div>
  <ul class="recursos" id="recursos">
    <li>Abre direto da tela inicial, como qualquer aplicativo</li>
    <li>Usa a câmera para ler o QR das etiquetas</li>
    <li>Ocupa quase nada de espaço e atualiza sozinho</li>
  </ul>
  <div class="rodape">
    <span>Já instalou? <a href="celular.html">Abrir o app</a></span>
    <span id="wa"></span>
  </div>
</main>
<script>
(function () {
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  var instalado = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  var iosVer = parseInt((ua.match(/Version\/(\d+)/) || [])[1] || (ua.match(/OS (\d+)_/) || [])[1] || '0', 10);
  var inApp = /FBAN|FBAV|Instagram|Line\/|WhatsApp|; wv\)/.test(ua);
  var safari = ios && /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua) && !inApp;
  var c = document.getElementById('conteudo');
  var link = location.href.split('#')[0].split('?')[0];
  var share = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg></span>';
  var mais = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg></span>';
  var pontosH = '<span class="ic" style="color:var(--ink)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></span>';
  var pontos = '<span class="ic" style="color:var(--ink)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></span>';

  document.getElementById('wa').innerHTML = '<a class="link-wa" href="https://wa.me/5531973109443?text=' + encodeURIComponent('Olá! Preciso de ajuda para instalar o app do EstoqueOn.') + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.41-.08-.13-.27-.2-.57-.35m-5.42 7.4a9.87 9.87 0 0 1-5.04-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.89 9.88m8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.16-3.48-8.41z"/></svg>Precisa de ajuda? Fale com a gente</a>';

  if (instalado) {
    c.innerHTML = '<div class="alert good"><span>O app já está instalado neste celular.</span></div><a class="btn primary" href="celular.html">Abrir o EstoqueOn</a>';
    return;
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  if (ios) {
    if (!safari) {
      c.innerHTML = '<div class="alert warn"><span>No iPhone, o app só pode ser instalado pelo <b>Safari</b>.</span></div>' +
        '<ol class="passos"><li><span>Toque em ' + pontos + ' ou em ' + share + ' e escolha <b>Abrir no Safari</b>.</span></li><li><span>No Safari, siga os dois passos que vão aparecer nesta página.</span></li></ol>' +
        '<button class="btn" id="copiar" type="button">Copiar o link da página</button>';
      document.getElementById('copiar').addEventListener('click', function () {
        var b = this; try { navigator.clipboard.writeText(link).then(function () { b.textContent = 'Link copiado. Cole no Safari.'; }); } catch (e) {}
      });
      return;
    }
    c.innerHTML = '<ol class="passos">' +
      (iosVer >= 26 ? '<li><span>Toque em ' + pontosH + ' no canto da barra do Safari e depois em ' + share + ' <b>Compartilhar</b>.</span></li>' : '<li><span>Toque em ' + share + ' <b>Compartilhar</b>, na barra do Safari.</span></li>') +
      '<li><span>Role e toque em ' + mais + ' <b>Adicionar à Tela de Início</b>, depois em <b>Adicionar</b>.</span></li>' +
      '<li><span>Abra o <b>EstoqueOn</b> pelo ícone que apareceu na tela inicial.</span></li></ol>';
    var seta = document.createElement('div'); seta.className = 'seta';
    if (iosVer >= 26) { seta.style.left = 'auto'; seta.style.right = '14px'; seta.style.transform = 'none'; seta.style.animation = 'none'; }
    seta.innerHTML = '<span>' + (iosVer >= 26 ? 'Menu ⋯ fica aqui' : 'Compartilhar fica aqui') + '</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';
    document.body.appendChild(seta);
    return;
  }

  if (android) {
    c.innerHTML = '<button class="btn primary" id="instalar" type="button" disabled>Preparando…</button><p class="hint" id="dica" style="text-align:center">Um toque e o app aparece na sua tela inicial.</p>';
    var btn = document.getElementById('instalar'), pedido = null;
    function manual() {
      btn.remove();
      document.getElementById('dica').outerHTML = (inApp || !/Chrome\//.test(ua) ? '<div class="alert warn"><span>Abra este link no <b>Chrome</b> para instalar com um toque.</span></div>' : '') +
        '<ol class="passos"><li><span>No Chrome, toque em ' + pontos + ' no canto de cima.</span></li><li><span>Toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</span></li><li><span>Confirme em <b>Instalar</b>.</span></li></ol>';
    }
    addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault(); pedido = e;
      btn.disabled = false; btn.textContent = 'Instalar o app';
    });
    btn.addEventListener('click', async function () {
      if (!pedido) return manual();
      pedido.prompt();
      var r = await pedido.userChoice; pedido = null;
      if (r.outcome === 'accepted') c.innerHTML = '<div class="alert good"><span>Pronto! O EstoqueOn está na sua tela inicial.</span></div><a class="btn primary" href="celular.html">Abrir agora</a>';
      else { btn.disabled = true; manual(); }
    });
    addEventListener('appinstalled', function () { c.innerHTML = '<div class="alert good"><span>Pronto! O EstoqueOn está na sua tela inicial.</span></div><a class="btn primary" href="celular.html">Abrir agora</a>'; });
    setTimeout(function () { if (!pedido && btn.isConnected) manual(); }, 3500);
    return;
  }

  // computador: mostra o QR para abrir esta página no celular
  document.getElementById('recursos').remove();
  c.innerHTML = '<div class="qrbox"><div id="qr"></div><b>Aponte a câmera do celular para o código</b><span style="font-size:.85rem;color:#6b5a5c">Ou envie este link para o celular: ' + link.replace(/^https?:\/\//, '') + '</span></div>';
  function qr() { if (window.QRCode) new QRCode(document.getElementById('qr'), { text: link, width: 360, height: 360, correctLevel: QRCode.CorrectLevel.M }); else setTimeout(qr, 200); }
  qr();
})();
</script>
</body>
</html>
